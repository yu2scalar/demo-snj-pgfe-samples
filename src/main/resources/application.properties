spring.application.name=demo-snj-pgfe-samples
# The connection settings (hosts, users, passwords) are in application-local.properties, made from
# application-local.properties.example and kept out of git.
spring.profiles.default=local

# Four DataSources (DataSourceConfig): three through ScalarDB Native JDBC, one per database, and one
# through the PostgreSQL Frontend of ScalarDB Cluster. All in READ COMMITTED, the isolation level of
# ScalarDB's transactions in the Cluster (scalar.db.consensus_commit.isolation_level=READ_COMMITTED):
# ScalarDB Native JDBC requires the same level on both sides.
app.datasource.customer.driver-class-name=com.scalar.db.nativejdbc.NativeJdbcDriver
app.datasource.customer.transaction-isolation=TRANSACTION_READ_COMMITTED
app.datasource.customer.auto-commit=false
app.datasource.customer.maximum-pool-size=10
app.datasource.customer.pool-name=customer

app.datasource.inventory.driver-class-name=com.scalar.db.nativejdbc.NativeJdbcDriver
app.datasource.inventory.transaction-isolation=TRANSACTION_READ_COMMITTED
app.datasource.inventory.auto-commit=false
app.datasource.inventory.maximum-pool-size=10
app.datasource.inventory.pool-name=inventory

app.datasource.ordering.driver-class-name=com.scalar.db.nativejdbc.NativeJdbcDriver
app.datasource.ordering.transaction-isolation=TRANSACTION_READ_COMMITTED
app.datasource.ordering.auto-commit=false
app.datasource.ordering.maximum-pool-size=10
app.datasource.ordering.pool-name=ordering

app.datasource.pgfe.driver-class-name=org.postgresql.Driver
app.datasource.pgfe.transaction-isolation=TRANSACTION_READ_COMMITTED
app.datasource.pgfe.auto-commit=false
app.datasource.pgfe.maximum-pool-size=10
app.datasource.pgfe.pool-name=pgfe

# Retry of a whole transaction (JdbcRetryConfig): conflicts (40001), deadlocks, lock timeouts
retry.initial-delay-ms=100
retry.max-attempts=3
retry.max-delay-ms=5000
retry.multiplier=2.0

# JSON property names in snake_case (Java names stay camelCase), e.g. customerId -> "customer_id"
spring.jackson.property-naming-strategy=SNAKE_CASE
